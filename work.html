<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Work - HEMM Shift Allocator</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main>
    <h1 id="page-title">My Work</h1>
    <div id="message" class="hidden"></div>
    <div id="content"><p class="muted">Loading...</p></div>
    <button class="btn secondary" id="refresh">Refresh</button>
  </main>

  <script>
    renderHeader('work.html');
    var role = getRole();
    var records = [];
    var busy = false;

    if (!ROLE_NAMES[role]) {
      window.location.href = 'index.html';
    }

    // ---------- Loading and saving ----------
    async function refresh() {
      try {
        records = await loadRecords();
        render();
      } catch (err) {
        document.getElementById('content').innerHTML = '';
        showError('Could not load the data. Please check the internet and press Refresh.', err);
      }
    }
    async function save(id, fields, okText) {
      if (busy) return;
      busy = true;
      try {
        await updateRecord(id, fields);
        records = await loadRecords();
        render();
        showMessage(okText || 'Saved.', 'ok');
      } catch (err) {
        showError('Sorry, the change could not be saved.', err);
      }
      busy = false;
    }
    document.getElementById('refresh').onclick = function () { clearMessage(); refresh(); };

    function render() {
      if (role === 'engineer') renderEngineer();
      else if (role === 'operator') renderOperator();
      else renderIncharge();
    }
    function byId(id) { return records.filter(function (r) { return r.id === id; })[0]; }

    // ---------- Maintenance Engineer ----------
    function renderEngineer() {
      document.getElementById('page-title').textContent = 'Maintenance Engineer: HEMM condition';
      var hemms = records.filter(function (r) { return r.record_type === 'HEMM'; });
      var fit = hemms.filter(isFit).length;
      var html = '<p>Tap a button to say if each machine is fit to work. <b>' + fit + ' of ' + hemms.length + '</b> are OK now.</p>';
      hemms.forEach(function (h) {
        var etaLine = '';
        if (h.status !== 'Resolved') {
          etaLine = h.expected_ok_at
            ? '<p class="' + (new Date(h.expected_ok_at) < new Date() ? 'muted' : '') + '"><b>Expected OK: ' + niceTime(h.expected_ok_at) + '</b> (' + etaFromNow(h.expected_ok_at) + ')' +
              (new Date(h.expected_ok_at) < new Date() ? ' Please update.' : '') + '</p>'
            : '<p class="muted">Expected OK time: not given yet.</p>';
        }
        html += '<div class="card" data-id="' + esc(h.id) + '">' +
          '<div class="row"><div class="grow"><h3>' + esc(h.name) + '</h3>' +
          '<span class="muted">' + esc(h.make_model) + ' &middot; Sl. no. ' + esc(h.serial_no) + '</span></div>' +
          '<span class="badge ' + hemmStatusClass(h) + '">' + hemmStatusText(h) + '</span></div>' + etaLine +
          '<label>Expected to be OK in (approx.)</label>' +
          '<select data-f="eta"><option value="keep">Keep as it is</option><option value="none">Not known</option>' +
          ETA_HOURS.map(function (n) { return '<option value="' + n + '">' + (n === 1 ? '1 hour' : n + ' hours') + '</option>'; }).join('') + '</select>' +
          '<p class="muted">Choose the time first, then tap Under repair or Breakdown.</p>' +
          '<div class="btn-row">' +
          '<button class="btn good' + (h.status === 'Resolved' ? ' on' : '') + '" data-act="status" data-val="Resolved">OK (fit)</button>' +
          '<button class="btn warn' + (h.status === 'In progress' ? ' on' : '') + '" data-act="status" data-val="In progress">Under repair</button>' +
          '<button class="btn bad' + (h.status === 'Open' ? ' on' : '') + '" data-act="status" data-val="Open">Breakdown</button></div>' +
          '<div class="field-grid">' +
          '<div><label>Location</label><select data-f="location">' + LOCATIONS.map(function (l) {
            return '<option' + (l === h.location ? ' selected' : '') + '>' + l + '</option>'; }).join('') + '</select></div>' +
          '<div><label>Repair urgency</label><select data-f="urgency">' + ['Low', 'Medium', 'High'].map(function (u) {
            return '<option' + (u === h.urgency ? ' selected' : '') + '>' + u + '</option>'; }).join('') + '</select></div>' +
          '<div><label>Breakdown chance per shift</label><select data-f="bprob">' + breakdownChoices(h).map(function (n) {
            return '<option value="' + n + '"' + (n === breakdownProbOf(h) ? ' selected' : '') + '>' + n + ' %</option>'; }).join('') + '</select></div></div>' +
          '<label>Remarks (optional)</label><input type="text" data-f="remarks" maxlength="200" value="' + esc(h.remarks || '') + '" placeholder="e.g. hydraulic hose leak">' +
          '<button class="btn secondary" data-act="details">Save time, location, urgency, breakdown chance and remarks</button></div>';
      });
      document.getElementById('content').innerHTML = html;
    }
    function breakdownChoices(h) {
      var cur = breakdownProbOf(h);
      var list = BREAKDOWN_CHOICES.slice();
      if (list.indexOf(cur) < 0) { list.push(cur); list.sort(function (a, b) { return a - b; }); }
      return list;
    }
    function engineerFields(card, status) {
      var f = {
        location: card.querySelector('[data-f=location]').value,
        urgency: card.querySelector('[data-f=urgency]').value,
        remarks: card.querySelector('[data-f=remarks]').value.trim() || null,
        breakdown_prob: parseFloat(card.querySelector('[data-f=bprob]').value)
      };
      var eta = card.querySelector('[data-f=eta]').value;
      if (status === 'Resolved') f.expected_ok_at = null;          // machine is OK, no waiting time
      else if (eta === 'none') f.expected_ok_at = null;
      else if (eta !== 'keep') f.expected_ok_at = new Date(Date.now() + parseInt(eta, 10) * 3600 * 1000).toISOString();
      return f;
    }

    // ---------- Operator ----------
    var opDate = null;
    function renderOperator() {
      document.getElementById('page-title').textContent = 'Operator: my duty';
      var me = byId(getOperatorId());
      if (!me || me.record_type !== 'OPERATOR') {
        document.getElementById('content').innerHTML =
          '<div class="card"><p>Please choose your name first.</p><a class="btn" href="index.html">Choose my name</a></div>';
        return;
      }
      var info = currentShiftInfo();
      if (!opDate) opDate = info.date;
      var mine = me.duty_date === opDate ? me : null;   // my mark for the chosen date
      var reason = leaveReason(me, opDate);             // 'Weekly off', 'Leave' or null
      var att0 = mine ? mine.attendance : 'Not marked';
      var attendance = (reason && !(att0 === 'Overtime' && reason === 'Weekly off')) ? 'Off' : att0;
      var others = SHIFTS.filter(function (s) { return s !== me.home_shift; });

      // Which shift and machine do I have for this date?
      var dutyShift = attendance === 'Overtime' ? mine.duty_shift : me.home_shift;
      var machineText = '';
      if (attendance === 'Present' || attendance === 'Overtime') {
        var alloc = computeAllocation(records, opDate, dutyShift);
        var mineA = alloc.assignments.filter(function (a) { return a.operator.id === me.id; })[0];
        machineText = (attendance === 'Overtime' && !mineA)
          ? '<div class="msg info">Your overtime interest is noted. Overtime costs extra, so it is used only when there are more machines than operators. You have no machine for now.</div>'
          : mineA
          ? '<div class="msg ok">Your machine for Shift ' + dutyShift + ': <b>' + esc(hemmLabel(mineA.hemm)) + '</b></div>'
          : '<div class="msg info">No machine for you yet in Shift ' + dutyShift + '. A fit machine of your type is needed. Check again later.</div>';
      }

      var badge = attendance === 'Present' ? '<span class="badge good">Present, Shift ' + me.home_shift + '</span>' :
        attendance === 'Absent' ? '<span class="badge bad">Absent, Shift ' + me.home_shift + '</span>' :
        attendance === 'Overtime' ? '<span class="badge info">Overtime interest, Shift ' + mine.duty_shift + '</span>' :
        attendance === 'Off' ? '<span class="badge warn">' + reason + ': not on duty</span>' :
        '<span class="badge none">Not marked</span>';

      document.getElementById('content').innerHTML =
        '<div class="card"><h3>' + esc(me.name) + '</h3>' +
        '<p class="muted">Home shift ' + me.home_shift + ' (' + SHIFT_TIMES[me.home_shift] + ') &middot; ' + esc(me.skill_group) + ' operator</p></div>' +
        '<label for="op-date">Duty date</label><input type="date" id="op-date" value="' + opDate + '">' +
        '<div class="card"><p>Your answer for ' + niceDate(opDate) + ': ' + badge + '</p>' + machineText + '</div>' +
        '<h2>My own shift (Shift ' + me.home_shift + ')</h2>' +
        (reason
          ? '<div class="msg info">' + reason + ' on ' + niceDate(opDate) + '. You are not counted for duty on this date.</div>'
          : '<div class="btn-row"><button class="btn good' + (attendance === 'Present' ? ' on' : '') + '" data-act="present">I will be PRESENT</button>' +
            '<button class="btn bad' + (attendance === 'Absent' ? ' on' : '') + '" data-act="absent">I will be ABSENT</button></div>') +
        '<h2>Overtime in another shift</h2>' +
        '<p class="muted">Want extra duty? Choose a shift that is not yours. Your answer for this date is replaced.</p>' +
        '<label for="ot-shift">Shift</label><select id="ot-shift">' + others.map(function (s) {
          return '<option value="' + s + '"' + (mine && mine.duty_shift === s ? ' selected' : '') + '>Shift ' + s + ' (' + SHIFT_TIMES[s] + ')</option>'; }).join('') + '</select>' +
        (reason === 'Leave'
          ? '<div class="msg info">You marked leave on this date, so overtime is not possible.</div>'
          : '<button class="btn warn' + (attendance === 'Overtime' ? ' on' : '') + '" data-act="overtime">I am interested in overtime</button>') +
        (attendance === 'Overtime' ? '<button class="btn secondary" data-act="clear">Withdraw my overtime interest</button>' : '') +
        leaveSection(me);
    }
    function leaveSection(me) {
      var today = dateToStr(new Date());
      var upcoming = (me.leave_dates || []).filter(function (d) { return d >= today; }).sort();
      return '<h2>Weekly off and leave</h2><div class="card">' +
        '<p>Your weekly off day: <b>' + (me.weekly_off == null ? 'not set' : DAY_NAMES[me.weekly_off]) + '</b></p>' +
        '<p class="muted">About ' + EXTRA_LEAVE_DAYS + ' more leave days a month are expected, besides the weekly off. Marking a day here in advance helps the tool plan.</p>' +
        '<label for="lv-date">A day you will NOT be present</label><input type="date" id="lv-date" min="' + today + '">' +
        '<button class="btn warn" data-act="addleave">Add leave day</button>' +
        '<h3>My marked leave days</h3>' +
        (upcoming.length ? upcoming.map(function (d) {
          return '<div class="row"><div class="grow"><b>' + niceDate(d) + '</b> <span class="muted">' + DAY_NAMES[weekdayOf(d)] + '</span></div>' +
            '<button class="btn secondary" style="width:auto;margin:0" data-act="rmleave" data-val="' + d + '">Remove</button></div>';
        }).join('') : '<p class="muted">No leave days marked.</p>') + '</div>';
    }
    function opFields(att, shift, date) {
      return { attendance: att, duty_date: date, duty_shift: shift, status: att === 'Overtime' ? 'In progress' : 'Resolved' };
    }

    // ---------- Shift Incharge ----------
    var inDate = null, inShift = null;
    function renderIncharge() {
      document.getElementById('page-title').textContent = 'Shift Incharge: attendance help';
      var info = currentShiftInfo();
      if (!inDate) { inDate = info.date; inShift = info.shift; }
      var ops = records.filter(function (r) { return r.record_type === 'OPERATOR' && r.home_shift === inShift; })
        .sort(function (a, b) { return a.name.localeCompare(b.name); });
      var html = '<p>Use this if an operator phones in. You can mark their attendance for them. Overtime is raised by the operator.</p>' +
        '<label for="in-date">Date</label><input type="date" id="in-date" value="' + inDate + '">' +
        '<div class="btn-row" style="margin-top:8px">' + SHIFTS.map(function (s) {
          return '<button class="btn secondary' + (s === inShift ? ' on' : '') + '" data-act="shift" data-val="' + s + '">Shift ' + s + '</button>'; }).join('') + '</div>' +
        '<a class="btn" href="dashboard.html">Open the dashboard</a>' +
        '<h2>Shift ' + inShift + ' operators</h2><div class="card">';
      ops.forEach(function (o) {
        var att = o.duty_date === inDate ? o.attendance : 'Not marked';
        var why = leaveReason(o, inDate);
        html += '<div class="row" data-id="' + esc(o.id) + '"><div class="grow"><b>' + esc(o.name) + '</b><br><span class="muted">' + esc(o.skill_group) + '</span></div>' +
          (why ? '<span class="badge warn">' + why + '</span>'
               : '<span class="badge ' + (att === 'Present' ? 'good' : att === 'Absent' ? 'bad' : att === 'Overtime' ? 'info' : 'none') + '">' + att + '</span>' +
                 '<div class="btn-row" style="width:100%"><button class="btn good' + (att === 'Present' ? ' on' : '') + '" data-act="present">Present</button>' +
                 '<button class="btn bad' + (att === 'Absent' ? ' on' : '') + '" data-act="absent">Absent</button></div>') + '</div>';
      });
      html += '</div>';
      var ot = records.filter(function (r) { return r.record_type === 'OPERATOR' && r.attendance === 'Overtime' && r.duty_date === inDate && r.duty_shift === inShift; });
      html += '<h2>Overtime interest for Shift ' + inShift + '</h2><div class="card">' + (ot.length ? ot.map(function (o) {
        return '<div class="row"><div class="grow"><b>' + esc(o.name) + '</b><br><span class="muted">' + esc(o.skill_group) + ', home Shift ' + o.home_shift + '</span></div><span class="badge info">Overtime</span></div>';
      }).join('') : '<p class="muted">Nobody has raised interest yet.</p>') + '</div>';
      document.getElementById('content').innerHTML = html;
    }

    // ---------- One click handler for the whole page ----------
    document.getElementById('content').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-act]');
      if (!btn) return;
      var act = btn.getAttribute('data-act');
      clearMessage();
      var card = btn.closest('[data-id]');
      if (role === 'engineer' && card) {
        var id = card.getAttribute('data-id');
        if (act === 'status') {
          var st = btn.getAttribute('data-val'); var f = engineerFields(card, st); f.status = st;
          save(id, f, 'Machine status saved.');
        } else if (act === 'details') {
          save(id, engineerFields(card, null), 'Details saved.');
        }
      } else if (role === 'operator') {
        var me = byId(getOperatorId());
        if (!me) return;
        if (act === 'present') save(me.id, opFields('Present', me.home_shift, opDate), 'Saved: you will be PRESENT on ' + niceDate(opDate) + '.');
        if (act === 'absent') save(me.id, opFields('Absent', me.home_shift, opDate), 'Saved: you will be ABSENT on ' + niceDate(opDate) + '.');
        if (act === 'overtime') save(me.id, opFields('Overtime', document.getElementById('ot-shift').value, opDate), 'Saved: your overtime interest is noted.');
        if (act === 'addleave') {
          var lv = document.getElementById('lv-date').value;
          var todayStr = dateToStr(new Date());
          if (!lv) { showMessage('Please choose a day first.', 'info'); return; }
          if (lv < todayStr) { showMessage('Please choose today or a day in the future.', 'info'); return; }
          var list = (me.leave_dates || []).filter(function (d) { return d >= todayStr && d !== lv; });
          list.push(lv); list.sort();
          save(me.id, { leave_dates: list }, 'Leave day added: ' + niceDate(lv) + '.');
        }
        if (act === 'rmleave') {
          var gone = btn.getAttribute('data-val');
          save(me.id, { leave_dates: (me.leave_dates || []).filter(function (d) { return d !== gone; }) }, 'Leave day removed.');
        }
        if (act === 'clear') save(me.id, { attendance: 'Not marked', duty_date: null, duty_shift: null, status: 'Open' }, 'Your overtime interest is withdrawn.');
      } else if (role === 'incharge') {
        if (act === 'shift') { inShift = btn.getAttribute('data-val'); renderIncharge(); }
        else if (card) {
          var op = byId(card.getAttribute('data-id'));
          save(op.id, opFields(act === 'present' ? 'Present' : 'Absent', op.home_shift, inDate), 'Attendance saved for ' + op.name + '.');
        }
      }
    });
    document.getElementById('content').addEventListener('change', function (e) {
      if (e.target.id === 'op-date') { opDate = e.target.value || opDate; renderOperator(); }
      if (e.target.id === 'in-date') { inDate = e.target.value || inDate; renderIncharge(); }
    });

    refresh();
  </script>
</body>
</html>
